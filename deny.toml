# cargo-deny configuration (supply-chain gate, see ADR-0002).
[graph]
targets = [
  "x86_64-unknown-none",
  "x86_64-unknown-linux-gnu",
]

[advisories]
version = 2

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
