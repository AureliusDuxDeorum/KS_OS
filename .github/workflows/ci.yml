name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Format, lint, supply chain
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain (pinned by rust-toolchain.toml)
        run: rustup show
      - run: cargo fmt --all -- --check
      - run: cargo clippy -p kernel --target x86_64-unknown-none -- -D warnings
      - run: cargo clippy -p xtask -- -D warnings
      - run: cargo clippy -p ksparse --all-targets -- -D warnings
      - run: cargo test -p ksparse
      - name: cargo-deny / cargo-audit
        run: |
          cargo install cargo-deny cargo-audit --locked
          cargo deny check
          cargo audit

  fuzz:
    name: Fuzz firmware/device parsers (60 s)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Nightly toolchain for libFuzzer
        run: rustup toolchain install nightly --profile minimal
      - run: cargo install cargo-fuzz --locked
      - name: Coverage-guided fuzzing
        working-directory: fuzz
        run: cargo +nightly fuzz run parsers -- -max_total_time=60 -rss_limit_mb=2048
      - name: Upload crashing inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts

  boot-test:
    name: Boot tests (QEMU + OVMF)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU and OVMF
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf
      - name: Rust toolchain (pinned by rust-toolchain.toml)
        run: rustup show
      - name: End-to-end boot, power-off and UEFI-setup tests
        run: cargo xtask test
      - name: Upload serial logs and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-artifacts
          path: |
            target/qemu/**/serial.log
            target/qemu/*.ppm
          if-no-files-found: ignore
