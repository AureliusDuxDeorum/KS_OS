[package]
name = "ksparse-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
ksparse = { path = "../crates/ksparse" }
ksbt = { path = "../crates/ksbt" }
ksnet = { path = "../crates/ksnet" }
kstpm = { path = "../crates/kstpm" }

# Standalone workspace: fuzzing needs a nightly toolchain and must not affect the main build.
[workspace]

[[bin]]
name = "parsers"
path = "fuzz_targets/parsers.rs"
test = false
doc = false
bench = false

[[bin]]
name = "bluetooth"
path = "fuzz_targets/bluetooth.rs"
test = false
doc = false
bench = false

[[bin]]
name = "network"
path = "fuzz_targets/network.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tpm"
path = "fuzz_targets/tpm.rs"
test = false
doc = false
bench = false
