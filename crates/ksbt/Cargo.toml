[package]
name = "ksbt"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "KS_OS Bluetooth host stack: HCI, L2CAP, ATT/GATT, SMP (LE Secure Connections) and HID-over-GATT as pure, host-testable code."

[dependencies]
ksparse = { path = "../ksparse" }
aes = { version = "0.8", default-features = false }
cmac = { version = "0.7", default-features = false }
p256 = { version = "0.14", default-features = false, features = ["ecdh", "arithmetic"] }
zeroize = { version = "1", default-features = false }
