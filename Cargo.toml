[workspace]
resolver = "2"
members = ["kernel", "xtask", "crates/ksparse", "crates/ksbt"]

[workspace.package]
# The single source of truth for the release version (X.Y.Z, see docs/VERSIONING.md).
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
debug = "line-tables-only"
